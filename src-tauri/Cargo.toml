[package]
name = "moviary"
version = "1.7.4"
description = "Kategorizace a přehrávání filmů pomocí VLC"
license = "MIT"
edition = "2021"

[lib]
name = "filmoteka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "moviary"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
notify = "8"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
